# fail2ban — filtre « abus » du site BVY et du portail
# Réponses 403 (robot d'IA ou outil d'aspiration refusé), 429 (trop de requêtes) ou 444 (faille cherchée).
# Un vrai visiteur n'en reçoit presque jamais ; 30 en 10 minutes = robot.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[^"]*" (403|429|444) 
ignoreregex =
