# fail2ban — filtre « piège à robots » du site BVY
# Toute ligne du journal /var/log/nginx/bvy-piege.log vient d'une visite de /acces-reserve/ (interdit dans
# robots.txt, lien invisible) ou d'une recherche de faille (.php, wp-admin, .env…) : l'adresse IP est bannie.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "
ignoreregex =
