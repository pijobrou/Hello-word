# =============================================================================
#  Portail BVY — portail.bvyaccountingtax.ca — configuration nginx (HTTPS)
#  Installé par remote-install-portail.sh sous le nom « bvy-portail.conf ».
#  nginx transmet tout au service Node du portail (127.0.0.1:3100).
# =============================================================================

# Robots d'IA, aspirateurs et visites sans User-Agent : refusés (même liste que le site, apps/website/bots.js).
map $http_user_agent $bvy_portail_robot {
    default 0;
    ""      1;
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|Claude-Web|anthropic-ai|CCBot|Google-Extended|GoogleOther|Applebot-Extended|Bytespider|meta-externalagent|meta-externalfetcher|FacebookBot|PerplexityBot|Perplexity-User|Amazonbot|cohere-ai|cohere-training-data-crawler|Diffbot|ImagesiftBot|Omgilibot|Timpibot|YouBot|AI2Bot|DuckAssistBot|MistralAI-User|PanguBot|img2dataset|FirecrawlAgent|Crawl4AI|Scrapy|HTTrack|python-requests|python-urllib|aiohttp|python-httpx|Go-http-client|libwww-perl|Wget|HeadlessChrome|PhantomJS|colly)" 1;
}
limit_req_zone  $binary_remote_addr zone=bvy_portail:10m       rate=10r/s;
limit_req_zone  $binary_remote_addr zone=bvy_portail_auth:10m  rate=1r/s;
limit_conn_zone $binary_remote_addr zone=bvy_portail_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name portail.bvyaccountingtax.ca;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://portail.bvyaccountingtax.ca$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portail.bvyaccountingtax.ca;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/portail.bvyaccountingtax.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portail.bvyaccountingtax.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bvyPortailSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/bvy-portail.access.log;
    error_log  /var/log/nginx/bvy-portail.error.log warn;

    client_max_body_size 21m;   # documents : 20 Mo maximum (vérifié aussi par le portail)
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn bvy_portail_conn 30;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Formulaires de connexion : limite plus stricte
    location ~ ^/(connexion|verification|mot-de-passe-oublie|reinitialiser|invitation) {
        if ($bvy_portail_robot) { return 403; }
        limit_req zone=bvy_portail_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_hide_header X-Powered-By;
    }

    location / {
        if ($bvy_portail_robot) { return 403; }
        limit_req zone=bvy_portail burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_hide_header X-Powered-By;
    }
}
