# =============================================================================
#  BVY Accounting & Tax Services — site public — configuration nginx (HTTP seul)
# =============================================================================
#  Version TEMPORAIRE, utilisée tant qu'aucun certificat HTTPS n'existe dans
#  /etc/letsencrypt/live/bvyaccountingtax.ca/.
#
#  Une fois le certificat obtenu (voir DEPLOIEMENT.md, section 6), relancez
#  le déploiement : le script bascule automatiquement vers la version HTTPS
#  (bvyaccountingtax.ca.conf).
#
#  Installé sous le nom « bvy-website.conf » (voir la version HTTPS).
# =============================================================================

# -----------------------------------------------------------------------------
# www.bvyaccountingtax.ca  ->  http://bvyaccountingtax.ca
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.bvyaccountingtax.ca;

    server_tokens off;

    # Fichiers de validation Let's Encrypt (obtention du certificat)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 http://bvyaccountingtax.ca$request_uri;
    }
}

# -----------------------------------------------------------------------------
# bvyaccountingtax.ca — le vrai site (HTTP)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bvyaccountingtax.ca;

    server_tokens off;

    root /var/www/bvy-website/current/public;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/bvy-website.access.log;
    error_log  /var/log/nginx/bvy-website.error.log warn;

    # En-têtes de sécurité (pas de HSTS tant que HTTPS n'est pas en place)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript image/svg+xml
               application/manifest+json application/rss+xml;

    error_page 404 /404.html;

    # Fichiers de validation Let's Encrypt (obtention du certificat)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Fichiers cachés (.env, .git, ...) : interdits
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # API (formulaire de contact, /api/health) -> service Node
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr (et non $proxy_add_x_forwarded_for) : le service Node lit
        # la PREMIÈRE adresse de X-Forwarded-For ; un visiteur ne doit pas
        # pouvoir la falsifier pour contourner la limite de 5 envois / 10 min.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_hide_header X-Powered-By;
        # Node envoie déjà ces en-têtes : on garde ceux de nginx (évite les doublons)
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        client_max_body_size 32k;
        expires off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;   # = Cache-Control: no-cache
    }
}
