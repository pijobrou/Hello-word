# =============================================================================
#  BVY Accounting & Tax Services — site public — configuration nginx (HTTPS)
# =============================================================================
#  Installé par remote-install.sh sous le nom « bvy-website.conf » :
#    - Ubuntu/Debian : /etc/nginx/sites-available/bvy-website.conf
#                      + lien dans /etc/nginx/sites-enabled/
#    - paquet nginx.org : /etc/nginx/conf.d/bvy-website.conf
#
#  Principe :
#    - nginx sert directement les pages statiques de  current/public
#      (rapide, et le site reste en ligne même si Node est arrêté) ;
#    - seules les adresses /api/ (formulaire de contact, santé) sont
#      transmises au service Node qui écoute sur 127.0.0.1:3000.
#
#  Certificat attendu : /etc/letsencrypt/live/bvyaccountingtax.ca/
#  (s'il n'existe pas encore, le script installe la version
#   « bvyaccountingtax.ca.http-only.conf » à la place).
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Port 80 (HTTP) : renouvellement Let's Encrypt + redirection vers HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bvyaccountingtax.ca www.bvyaccountingtax.ca;

    server_tokens off;

    # Fichiers de validation Let's Encrypt (renouvellement du certificat)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Tout le reste : redirection permanente vers https://bvyaccountingtax.ca
    location / {
        return 301 https://bvyaccountingtax.ca$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2) HTTPS www.bvyaccountingtax.ca  ->  https://bvyaccountingtax.ca
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bvyaccountingtax.ca;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bvyaccountingtax.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bvyaccountingtax.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bvySSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bvyaccountingtax.ca$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 3) HTTPS bvyaccountingtax.ca — le vrai site
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bvyaccountingtax.ca;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/bvyaccountingtax.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bvyaccountingtax.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bvySSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Dossier des pages publiques (lien « current » = version active)
    root /var/www/bvy-website/current/public;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/bvy-website.access.log;
    error_log  /var/log/nginx/bvy-website.error.log warn;

    # --- En-têtes de sécurité (hérités par tous les « location » ci-dessous,
    #     car aucun d'eux n'utilise add_header) ---------------------------------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # --- Compression gzip des fichiers texte ------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript image/svg+xml
               application/manifest+json application/rss+xml;

    # --- Page 404 personnalisée --------------------------------------------------
    error_page 404 /404.html;

    # --- Let's Encrypt (au cas où la validation passerait par HTTPS) -------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- Fichiers cachés (.env, .git, ...) : interdits ---------------------------
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # --- API (formulaire de contact, /api/health) -> service Node ---------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr (et non $proxy_add_x_forwarded_for) : le service Node lit
        # la PREMIÈRE adresse de X-Forwarded-For ; un visiteur ne doit pas
        # pouvoir la falsifier pour contourner la limite de 5 envois / 10 min.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_hide_header X-Powered-By;
        # Node envoie déjà ces en-têtes : on garde ceux de nginx (évite les doublons)
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        client_max_body_size 32k;
        expires off;
    }

    # --- Images, CSS, JS, polices : cache navigateur 7 jours ---------------------
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # --- Pages HTML (et robots.txt, sitemap.xml) : toujours revalidées ----------
    #     /services/  -> public/services/index.html
    #     /services   -> redirection 301 vers /services/ (comme le service Node)
    #     /tarifs     -> public/tarifs.html (si ce fichier existe)
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;   # = Cache-Control: no-cache
    }
}
