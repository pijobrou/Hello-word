<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Traducteur Audio</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
<div class="wrap">
  <h1>🎧 Traducteur Audio EN → FR</h1>

  <button id="tab" class="big">🔊 Traduire le son de cet onglet</button>
  <p class="hint">Écoute directement l'audio de l'onglet (vidéo, live, appel…), même sans sous-titres.
    Chrome/Edge 135+.</p>
  <button id="settingsBtn" class="secondary wide">⚙️ Réglages de la voix : vitesse, hauteur, profils…</button>

  <div class="row">
    <label for="enabled"><strong>Vidéos : doublage FR</strong><br>
      <span class="hint">Variante via les sous-titres anglais (YouTube, vidéos HTML5).</span></label>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </div>

  <div class="row"><label for="rate">Vitesse voix <span id="rateVal"></span></label>
    <input type="range" id="rate" min="0.5" max="2" step="0.05"></div>
  <div class="row"><label for="duckVolume">Volume vidéo pendant la voix <span id="duckVal"></span></label>
    <input type="range" id="duckVolume" min="0" max="1" step="0.05"></div>
  <div class="row"><label for="chunking">Découpage des phrases</label>
    <select id="chunking">
      <option value="fast">Rapide</option>
      <option value="balanced">Équilibré</option>
      <option value="full">Phrases complètes (plus clair)</option>
    </select></div>
  <div class="row"><label for="voiceName">Voix française</label>
    <select id="voiceName"></select></div>
  <div class="row"><label for="showOverlay">Afficher le texte FR à l'écran</label>
    <input type="checkbox" id="showOverlay"></div>

  <div class="card n8n-card">
    <div class="row">
      <label for="engineN8n"><strong>🎙️ Voix humaine IA (n8n)</strong><br>
        <span id="n8nBadge" class="hint">Non configurée</span></label>
      <input type="checkbox" id="engineN8n">
    </div>
    <button id="n8nConfig" class="secondary">⚙️ Configurer la voix IA</button>
  </div>

  <p class="hint">Sur YouTube, activez les sous-titres (touche <b>C</b>), en anglais ou auto-générés.</p>

  <div class="buttons">
    <button id="mic" class="secondary">🎙️ Mode micro</button>
    <button id="test" class="secondary">🔊 Tester</button>
    <button id="diag" class="secondary">🩺 Diagnostics</button>
  </div>
</div>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
