<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Traducteur Audio — Écoute</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap page">
  <h1 id="heading">🎙️ Anglais → voix française</h1>
  <p class="hint" id="intro"></p>

  <div class="row" id="headphonesRow">
    <label for="headphones">J'utilise un casque (continuer d'écouter pendant la voix française)</label>
    <input type="checkbox" id="headphones">
  </div>
  <div class="row" id="tabVolumeRow" hidden>
    <label for="tabVolume">Volume de l'onglet <span id="tabVolumeVal"></span></label>
    <input type="range" id="tabVolume" min="0" max="1" step="0.05" value="1">
  </div>

  <div class="buttons">
    <button id="toggle">▶️ Démarrer l'écoute</button>
    <button id="clear" class="secondary">Effacer</button>
  </div>
  <p id="status" class="hint">À l'arrêt.</p>
  <p id="notice" class="hint status-warn" hidden></p>
  <p id="interim" class="hint"></p>

  <div id="log" class="log"></div>
</div>
<script src="common.js"></script>
<script src="listen.js"></script>
</body>
</html>
